# Generated by script/sync_deploy_template.mjs in cloudflare-email.
name = "cloudflare-email-ingress"
main = "src/index.js"
compatibility_date = "2026-09-10"

[observability]
enabled = true

[[r2_buckets]]
binding = "INBOUND_EMAIL_STORE"
bucket_name = "cloudflare-email-inbound"
[[queues.producers]]
binding = "INBOUND_EMAIL_QUEUE"
queue = "cloudflare-email-inbound"
[[queues.consumers]]
queue = "cloudflare-email-inbound"
max_batch_size = 5
max_batch_timeout = 5
max_retries = 10
retry_delay = 300
[triggers]
crons = ["* * * * *"]
