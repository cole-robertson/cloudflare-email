name = "cloudflare-email-ingress-unconfigured"
main = "src/index.js"
compatibility_date = "2026-09-10"

[env.development]
name = "cloudflare-email-ingress-development"

[env.staging]
name = "cloudflare-email-ingress-staging"

[env.production]
name = "cloudflare-email-ingress-production"

# Required secrets (set via `npx wrangler secret put NAME --env production`):
#   RAILS_INGRESS_URL  - https://your-rails-app.example.com/rails/action_mailbox/cloudflare/inbound_emails
#   INGRESS_SECRET     - shared secret matching cloudflare.ingress_secret in Rails credentials

# After deploying, in the Cloudflare dashboard:
#   Email Routing -> Routes -> "Send to a Worker" -> select the matching environment Worker
