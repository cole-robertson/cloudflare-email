name = "cloudflare-email-ingress-unconfigured"
main = "src/index.js"
compatibility_date = "2026-09-10"

[env.development]
name = "cloudflare-email-ingress-development"

[env.staging]
name = "cloudflare-email-ingress-staging"

[env.production]
name = "cloudflare-email-ingress-production"

# Required secrets (set via `npx wrangler secret put NAME --env production`):
#   RAILS_INGRESS_URL  - https://your-rails-app.example.com/rails/action_mailbox/cloudflare/inbound_emails
#   INGRESS_SECRET     - shared secret matching cloudflare.ingress_secret in Rails credentials

# After deploying, in the Cloudflare dashboard:
#   Email Routing -> Routes -> "Send to a Worker" -> select the matching environment Worker

# Durable delivery is the default. Create these private resources before deploy.
# See docs/durable-inbound.md. Buckets must not expire pending objects.
# Explicit emergency fallback: set INBOUND_DELIVERY_MODE = "direct" in the
# chosen environment's [env.<name>.vars]. Keep recovery bindings and cron.

[[env.development.r2_buckets]]
binding = "INBOUND_EMAIL_STORE"
bucket_name = "cloudflare-email-inbound-development"
[[env.development.queues.producers]]
binding = "INBOUND_EMAIL_QUEUE"
queue = "cloudflare-email-inbound-development"
[[env.development.queues.consumers]]
queue = "cloudflare-email-inbound-development"
max_batch_size = 5
max_batch_timeout = 5
max_retries = 10
retry_delay = 300
[env.development.triggers]
crons = ["* * * * *"]

[[env.staging.r2_buckets]]
binding = "INBOUND_EMAIL_STORE"
bucket_name = "cloudflare-email-inbound-staging"
[[env.staging.queues.producers]]
binding = "INBOUND_EMAIL_QUEUE"
queue = "cloudflare-email-inbound-staging"
[[env.staging.queues.consumers]]
queue = "cloudflare-email-inbound-staging"
max_batch_size = 5
max_batch_timeout = 5
max_retries = 10
retry_delay = 300
[env.staging.triggers]
crons = ["* * * * *"]

[[env.production.r2_buckets]]
binding = "INBOUND_EMAIL_STORE"
bucket_name = "cloudflare-email-inbound-production"
[[env.production.queues.producers]]
binding = "INBOUND_EMAIL_QUEUE"
queue = "cloudflare-email-inbound-production"
[[env.production.queues.consumers]]
queue = "cloudflare-email-inbound-production"
max_batch_size = 5
max_batch_timeout = 5
max_retries = 10
retry_delay = 300
[env.production.triggers]
crons = ["* * * * *"]
