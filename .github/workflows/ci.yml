name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

jobs:
  ruby:
    name: "Ruby ${{ matrix.ruby }} × Rails ${{ matrix.rails }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4"]
        rails: ["7_1", "7_2", "8_0", "8_1"]
        exclude:
          - ruby: "3.2"
            rails: "8_0"
          - ruby: "3.2"
            rails: "8_1"
        include:
          - ruby: "4.0"
            rails: "8_1"
    env:
      BUNDLE_GEMFILE: "${{ github.workspace }}/gemfiles/rails_${{ matrix.rails }}.gemfile"
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "${{ matrix.ruby }}"
          bundler-cache: true
      - run: bundle exec rake test
      - run: bundle exec ruby script/verify_package.rb
        if: matrix.ruby == '3.4' && matrix.rails == '8_1'

  worker:
    name: Cloudflare Worker (JavaScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: templates/worker/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run check

  local-ingress:
    name: Local workerd → Rails ingress
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: "${{ github.workspace }}/gemfiles/local_ingress.gemfile"
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: templates/worker/package-lock.json
      - run: npm ci --prefix templates/worker
      - run: bundle exec ruby script/verify_local_ingress.rb
